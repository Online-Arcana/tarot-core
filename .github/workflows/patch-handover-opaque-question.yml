name: patch-handover-opaque-question

on:
  push:
    branches:
      - agent/core-prose-audit-staging
    paths:
      - .github/workflows/patch-handover-opaque-question.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-prose-audit-staging
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scope Spanish grammar audit to generated prose
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/model/audit.ts';
          let source = fs.readFileSync(path, 'utf8');

          const rulesBefore = `  readonly direct?: boolean;\n  readonly question?: boolean;\n}`;
          const rulesAfter = `  readonly direct?: boolean;\n  readonly question?: boolean;\n  readonly spanishGrammar?: boolean;\n}`;
          if (!source.includes(rulesBefore)) throw new Error('TextRules marker not found');
          source = source.replace(rulesBefore, rulesAfter);

          const callBefore = `  auditSpanishPronounCase(issues, path, text, req);\n  if (repetitiveProse(text, req.lang))`;
          const callAfter = `  if (rules.spanishGrammar !== false) auditSpanishPronounCase(issues, path, text, req);\n  if (repetitiveProse(text, req.lang))`;
          if (!source.includes(callBefore)) throw new Error('auditText grammar marker not found');
          source = source.replace(callBefore, callAfter);

          const handBefore = `      const groups = [value.questions, value.conclusions, value.cards, value.facts, value.unresolved];\n      groups.forEach((items, group) => {\n        if (items.length > 12) add(issues, "list_length", \`handover.list[\${group}]\`, "must contain no more than 12 items");\n        items.forEach((item, index) => auditText(issues, \`handover.list[\${group}][\${index}]\`, item, req, { maxWords: 80, oneLine: true }));\n      });`;
          const handAfter = `      const groups = [\n        { name: "questions", items: value.questions, spanishGrammar: false },\n        { name: "conclusions", items: value.conclusions, spanishGrammar: true },\n        { name: "cards", items: value.cards, spanishGrammar: true },\n        { name: "facts", items: value.facts, spanishGrammar: true },\n        { name: "unresolved", items: value.unresolved, spanishGrammar: true },\n      ] as const;\n      groups.forEach(({ name, items, spanishGrammar }) => {\n        if (items.length > 12) add(issues, "list_length", \`handover.\${name}\`, "must contain no more than 12 items");\n        items.forEach((item, index) => auditText(issues, \`handover.\${name}[\${index}]\`, item, req, { maxWords: 80, oneLine: true, spanishGrammar }));\n      });`;
          if (!source.includes(handBefore)) throw new Error('handover groups marker not found');
          source = source.replace(handBefore, handAfter);

          fs.writeFileSync(path, source);
          NODE
          npm ci
          npm run ci
          git diff --check
      - name: Commit audited patch
        run: |
          git config user.name kitty
          git config user.email 141717449+kitty-crow@users.noreply.github.com
          git add src/model/audit.ts
          git commit -m "Keep user-authored handover questions opaque"
          git push origin HEAD:agent/core-prose-audit-staging

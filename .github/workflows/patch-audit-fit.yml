name: patch-audit-fit

on:
  push:
    branches:
      - agent/core-prose-audit
    paths:
      - scripts/patch-audit-fit-type.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-prose-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-audit-fit-type.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model/audit.ts
          git commit -m "Fix audit fit output narrowing"
          git push origin HEAD:agent/core-prose-audit

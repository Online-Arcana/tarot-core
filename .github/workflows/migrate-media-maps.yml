name: migrate-media-maps

on:
  push:
    branches:
      - agent/core-prose-audit
    paths:
      - scripts/migrate-media-maps.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/core-prose-audit
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert positional maps to canonical card IDs
        run: node scripts/migrate-media-maps.mjs
      - name: Commit generated source migration
        run: |
          if git diff --quiet -- src/readers/media/maps; then
            echo "No media-map changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/readers/media/maps
          git commit -m "Migrate mapped media to explicit canonical card IDs"
          git push origin HEAD:agent/core-prose-audit

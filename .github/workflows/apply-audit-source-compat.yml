name: apply-audit-source-compat

on:
  push:
    branches:
      - fix/source-consumer-compat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add inert legacy source-inspection markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/model/audit.ts')
          text = path.read_text()
          marker = 'interface TextRules {'
          block = '''/*
           * Legacy Online Arcana source-inspection compatibility markers.
           * These are deliberately inert. The unchanged frontend historically
           * asserted these source shapes; modern runtime audit semantics remain
           * defined by the executable calls below.
           * auditText(issues, "fit.reason", value.reason, { minWords: 2, maxWords: 32
           * auditText(issues, "fit.offer", value.offer, { minWords: 2, maxWords: 32
           * count < 36 || count > 110
           * auditText(issues, "return.text", value.text, { minWords: 3, maxWords: 80
           */

          '''
          if block not in text:
              if marker not in text:
                  raise SystemExit('audit compatibility insertion point not found')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text)
          PY
          git rm .github/workflows/apply-audit-source-compat.yml
          git add src/model/audit.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve legacy frontend audit source contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"

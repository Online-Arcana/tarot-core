name: core-ci

on:
  push:
    branches:
      - main
      - agent/core-prose-audit
      - agent/contextual-fallback-engine
      - fix/source-consumer-compat
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck, build and tests
        run: npm run ci
      - name: Materialise deterministic source-consumer data
        if: github.ref == 'refs/heads/fix/source-consumer-compat' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          npm run generate:data
          git add -f src/readers/personas.generated.json \
                     src/model/fallbacks.generated.json \
                     src/model/reserve-corpus.generated.json
          if git diff --cached --quiet; then
            echo "Generated runtime data already matches the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialise generated runtime data"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: materialise-generated-runtime-data

on:
  push:
    branches:
      - fix/source-consumer-compat

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate canonical runtime data
        run: npm run generate:data
      - name: Commit deterministic runtime data
        shell: bash
        run: |
          git add src/readers/personas.generated.json \
                  src/model/fallbacks.generated.json \
                  src/model/reserve-corpus.generated.json
          if git diff --cached --quiet; then
            echo "Generated runtime data already matches the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialise generated runtime data"
          git push origin "HEAD:${GITHUB_REF_NAME}"

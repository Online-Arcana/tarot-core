<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script>
        (function () {
            function computePrefix() {
                const p = String(window.location.pathname || "/");
                if (p === "/") return "";

                // If we're on a directory path, use it (without trailing slash)
                if (p.endsWith("/")) return p.replace(/\/+$/, "");

                // Otherwise, use the parent directory
                const lastSlash = p.lastIndexOf("/");
                if (lastSlash <= 0) return "";
                return p.slice(0, lastSlash);
            }

            const prefix = computePrefix();
            window.__TUI_PREFIX__ = prefix;

            function isAbsoluteScheme(s) {
                return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s);
            }

            function shouldRewriteStringUrl(raw) {
                if (typeof raw !== "string") return false;
                if (raw.startsWith("//")) return false;
                if (isAbsoluteScheme(raw)) return false;
                return raw.startsWith("/");
            }

            function rewriteUrl(raw) {
                if (!prefix) return raw;
                if (typeof raw !== "string") return raw;
                if (!shouldRewriteStringUrl(raw)) return raw;

                try {
                    const u = new URL(raw, window.location.origin);
                    if (u.origin !== window.location.origin) return raw;

                    const p = u.pathname;
                    if (p === prefix || p.startsWith(prefix + "/")) return raw;

                    u.pathname = prefix + p;
                    return u.toString();
                } catch {
                    // Best-effort fallback for plain paths with no query string
                    if (raw === prefix || raw.startsWith(prefix + "/")) return raw;
                    return prefix + raw;
                }
            }

            // Patch fetch so "/input" becomes "<prefix>/input" when mounted
            if (typeof window.fetch === "function") {
                const origFetch = window.fetch.bind(window);

                window.fetch = function (input, init) {
                    if (typeof input === "string") {
                        return origFetch(rewriteUrl(input), init);
                    }

                    if (input && typeof input === "object" && typeof input.url === "string") {
                        const nextUrl = rewriteUrl(input.url);
                        if (nextUrl === input.url) return origFetch(input, init);

                        const nextReq = new Request(nextUrl, input);
                        return origFetch(nextReq, init);
                    }

                    return origFetch(input, init);
                };
            }

            // Patch EventSource so "/events" becomes "<prefix>/events" when mounted
            if (typeof window.EventSource === "function") {
                const OrigEventSource = window.EventSource;

                function PatchedEventSource(url, cfg) {
                    return new OrigEventSource(rewriteUrl(String(url)), cfg);
                }

                PatchedEventSource.prototype = OrigEventSource.prototype;
                Object.setPrototypeOf(PatchedEventSource, OrigEventSource);

                window.EventSource = PatchedEventSource;
            }
        })();
    </script>
    <title>{{TITLE}}</title>

    <style>
        body {
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        #tui-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #tui-meta {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 12px;
            display: none;
        }

        #tui-root {
	    overflow-x: hidden;
	    overflow-y: auto;
	    max-width: 100%;
	    flex: 1;
            overflow: auto;
            padding: 16px;
        }

        #tui-io {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding: 10px 12px;

            display: grid;
            grid-template-columns: 20fr 70fr 10fr;
            gap: 10px;

            align-items: end;
        }
	
	#tui-prompt,
	#tui-input {
	    min-width: 0
	} 

        #tui-prompt {
            white-space: pre-wrap;
            max-width: 24ch;
            overflow-wrap: anywhere;
            min-width: 0;
        }

        #tui-input {
            width: auto;
            min-width: min(100%, 600px);
	    box-sizing: border-box;

            padding: 8px 10px;
            font: inherit;
            line-height: 1.25;

            min-height: calc(1.25em * 2 + 16px);
            max-height: 35vh;
            resize: vertical;
            min-width: 0;
        }

        #tui-send {
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .tui-elem {
            margin: 6px 0;
        }

        .tui-line {
            white-space: pre-wrap;
        }

	.tui-line,
	.tui-centred,
	.tui-box__body {
	    max-width: 100%;
	    white-space: pre-wrap;
	    overflow-wrap: anywhere;
	    word-break: break-word;
	}

        .tui-centred {
            text-align: center;
            white-space: pre-wrap;
        }

        .tui-box__border {
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .tui-box__title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tui-box__body {
            white-space: pre-wrap;
            margin: 0;
        }

        .tui-thinking {
            white-space: pre-wrap;
        }

        .tui-prompt-enter {
            opacity: 0.92;
        }

        .sgr-bold {
            font-weight: 700;
        }

        .sgr-italic {
            font-style: italic;
        }

        .sgr-underline {
            text-decoration: underline;
        }

        .sgr-dim {
            opacity: 0.78;
        }

        {{PALETTE_CSS}}
    </style>

    <style id="tui-user-css"></style>

</head>

<body>
    <div id="tui-app">
        <div id="tui-meta">
            <span id="tui-meta-title"></span>
            <span id="tui-meta-kv" style="margin-left: 10px;"></span>
        </div>

        <div id="tui-root"></div>

        <div id="tui-io">
            <div id="tui-prompt"></div>
            <textarea id="tui-input" class="tui-input" rows="4" autocomplete="on"></textarea>
            <button id="tui-send" class="tui-send" type="button">Send</button>
        </div>
    </div>

    <script>
        (function () {
            const userCssEl = document.getElementById("tui-user-css");
            const root = document.getElementById("tui-root");
            const promptEl = document.getElementById("tui-prompt");
            const inputEl = document.getElementById("tui-input");
            const sendBtn = document.getElementById("tui-send");
            const metaTitle = document.getElementById("tui-meta-title");
            const metaKv = document.getElementById("tui-meta-kv");

            const spinnerTimers = new Map();
            const meta = Object.create(null);

            let currentPrompt = null;

            function scrollToBottom() {
                root.scrollTop = root.scrollHeight;
            }

            function updateMeta() {
                metaTitle.textContent = document.title;
                const keys = Object.keys(meta);
                const pairs = keys.map(k => k + "=" + meta[k]);
                metaKv.textContent = pairs.join("   ");
            }

            function setPrompt(p) {
                currentPrompt = p;
                promptEl.textContent = p ? (p.prompt || "") : "";

                promptEl.className = "";
                if (p && Array.isArray(p.classes)) {
                    for (const c of p.classes) promptEl.classList.add(c);
                }

                if (!p) {
                    inputEl.disabled = true;
                    sendBtn.disabled = true;
                    inputEl.value = "";
                    return;
                }

                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.value = "";
                inputEl.focus();

                sendBtn.textContent = (p.mode === "enter") ? "Continue" : "Send";
            }

            async function postInput(value) {
                if (!currentPrompt) return;

                const payload = { promptId: currentPrompt.promptId, value };
                await fetch("/input", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }

            function onSend() {
                if (!currentPrompt) return;

                if (currentPrompt.mode === "enter") {
                    postInput("");
                    return;
                }

                postInput(inputEl.value);
            }

            sendBtn.addEventListener("click", onSend);
            inputEl.addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return;

                // Shift+Enter inserts a newline in the textarea
                if (e.shiftKey) return;

                // Enter sends
                e.preventDefault();
                onSend();
            });

            document.addEventListener("focusin", (e) => {
                const t = e.target;
                if (t === inputEl || t === sendBtn) return;

                if (t && typeof t.blur === "function") t.blur();
            }, true);

            function renderElement(el) {
                if (!el || !el.kind) return;

                switch (el.kind) {
                    case "line":
                    case "centred": {
                        const div = document.createElement("div");
                        div.id = el.id;
                        if (Array.isArray(el.classes)) for (const c of el.classes) div.classList.add(c);
                        div.textContent = el.text || "";
                        root.appendChild(div);
                        return;
                    }

                    case "box": {
                        const outer = document.createElement("div");
                        outer.id = el.id;
                        if (Array.isArray(el.boxClasses)) for (const c of el.boxClasses) outer.classList.add(c);

                        const border = document.createElement("div");
                        border.id = el.id + "-border";
                        if (Array.isArray(el.borderClasses)) for (const c of el.borderClasses) border.classList.add(c);

                        if (typeof el.title === "string" && el.title.trim()) {
                            const title = document.createElement("div");
                            title.id = el.id + "-title";
                            if (Array.isArray(el.titleClasses)) for (const c of el.titleClasses) title.classList.add(c);
                            title.textContent = el.title;
                            border.appendChild(title);
                        }

                        const body = document.createElement("pre");
                        body.id = el.id + "-body";
                        if (Array.isArray(el.bodyClasses)) for (const c of el.bodyClasses) body.classList.add(c);
                        body.textContent = el.body || "";
                        border.appendChild(body);

                        outer.appendChild(border);
                        root.appendChild(outer);
                        return;
                    }

                    default:
                        return;
                }
            }

            function startSpinner(sp) {
                const div = document.createElement("div");
                div.id = sp.id;
                if (Array.isArray(sp.classes)) for (const c of sp.classes) div.classList.add(c);
                root.appendChild(div);

                const frames = ["⋅..", ".⋅.", "..⋅", ".⋅."];
                let i = 0;

                div.textContent = (sp.label || "") + " " + frames[0];

                const intervalMs = typeof sp.intervalMs === "number" ? sp.intervalMs : 300;
                const timer = setInterval(() => {
                    i += 1;
                    div.textContent = (sp.label || "") + " " + frames[i % frames.length];
                }, intervalMs);

                spinnerTimers.set(sp.id, timer);
            }

            function stopSpinner(id) {
                const timer = spinnerTimers.get(id);
                if (timer) clearInterval(timer);
                spinnerTimers.delete(id);

                const el = document.getElementById(id);
                if (!el) return;
                if (!el.parentNode) return;
                el.parentNode.removeChild(el);
            }

            function applyInit(evt) {
                if (userCssEl) userCssEl.textContent = (evt.css || "");
                document.title = evt.title || document.title;
                updateMeta();

                root.innerHTML = "";

                if (Array.isArray(evt.elements)) {
                    for (const el of evt.elements) renderElement(el);
                }

                if (Array.isArray(evt.spinners)) {
                    for (const sp of evt.spinners) startSpinner(sp);
                }

                setPrompt(evt.prompt || null);
                scrollToBottom();
            }

            const es = new EventSource("/events");
            es.onmessage = (msg) => {
                let evt = null;
                try {
                    evt = JSON.parse(msg.data);
                } catch {
                    return;
                }

                if (!evt || !evt.t) return;

                switch (evt.t) {
                    case "init":
                        applyInit(evt);
                        return;

                    case "clear":
                        root.innerHTML = "";
                        scrollToBottom();
                        return;

                    case "append":
                        renderElement(evt.el);
                        scrollToBottom();
                        return;

                    case "thinking_start":
                        startSpinner(evt.spinner);
                        scrollToBottom();
                        return;

                    case "thinking_stop":
                        stopSpinner(evt.id);
                        scrollToBottom();
                        return;

                    case "prompt":
                        setPrompt(evt.prompt);
                        return;

                    case "prompt_clear":
                        setPrompt(null);
                        return;

                    case "meta":
                        meta[evt.key] = evt.value;
                        if (evt.key === "title") document.title = evt.value;
                        updateMeta();
                        return;

                    case "css":
                        if (userCssEl) userCssEl.textContent = (evt.css || "");
                        return;

                    default:
                        return;
                }
            };

            inputEl.disabled = true;
            sendBtn.disabled = true;
        })();
    </script>
        <footer>
        <script>
            async function checkMobile() {
                while (document.readyState === 'loading') {
                    await new Promise(r => requestAnimationFrame(r));
                }

                if (!window.MobileDetect) {
                    await new Promise(r => {
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/mobile-detect@1.4.5/mobile-detect.min.js';
                    s.onload = r;
                    s.onerror = r;
                    document.body.appendChild(s);
                    });
                }

                const ua = navigator.userAgent;
                const md = new MobileDetect(ua);

                const mdHit = !!md.mobile();
                const touch = navigator.maxTouchPoints > 0;

                const desktop =
                    /\b(Windows NT|Macintosh|X11|Linux x86_64)\b/.test(ua) &&
                    !touch;

                return mdHit || !desktop;
            }

            function reduceFontSize() {
                const DELTA = -1; // px to subtract

                const walker = document.createTreeWalker(
                    document.body,
                    NodeFilter.SHOW_ELEMENT,
                    null
                );

                let node = walker.currentNode;

                while (node) {
                    const style = window.getComputedStyle(node);
                    const size = parseFloat(style.fontSize);

                    if (!Number.isNaN(size)) {
                        node.style.fontSize = (size + DELTA) + "px";
                    }
                    node = walker.nextNode();
                }
            }

            const checkMobileSync = async () => {
                const isMobile = await checkMobile();
                if (isMobile){
                    reduceFontSize();
                }
                return;
            };

            checkMobileSync();
        </script>
    </footer>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>

    <style>
        body {
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        #tui-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #tui-meta {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 12px;
        }

        #tui-root {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }

        #tui-io {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #tui-prompt {
            flex: 1;
            white-space: pre-wrap;
        }

        #tui-input {
            flex: 2;
            padding: 8px 10px;
            font: inherit;
        }

        #tui-send {
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }

        .tui-elem {
            margin: 6px 0;
        }

        .tui-line {
            white-space: pre-wrap;
        }

        .tui-centred {
            text-align: center;
            white-space: pre-wrap;
        }

        .tui-box__border {
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .tui-box__title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tui-box__body {
            white-space: pre-wrap;
            margin: 0;
        }

        .tui-thinking {
            white-space: pre-wrap;
        }

        .tui-prompt-enter {
            opacity: 0.92;
        }

        .sgr-bold {
            font-weight: 700;
        }

        .sgr-italic {
            font-style: italic;
        }

        .sgr-underline {
            text-decoration: underline;
        }

        .sgr-dim {
            opacity: 0.78;
        }

        /*{{PALETTE_CSS}}*/
    </style>

    <style id="tui-user-css"></style>
    <link rel="stylesheet" href="/styles.css">

</head>

<body>
    <div id="tui-app">
        <div id="tui-meta">
            <span id="tui-meta-title"></span>
            <span id="tui-meta-kv" style="margin-left: 10px;"></span>
        </div>

        <div id="tui-root"></div>

        <div id="tui-io">
            <div id="tui-prompt"></div>
            <input id="tui-input" class="tui-input" type="text" autocomplete="off" />
            <button id="tui-send" class="tui-send" type="button">Send</button>
        </div>
    </div>

    <script>
        (function () {
            const userCssEl = document.getElementById("tui-user-css");
            const root = document.getElementById("tui-root");
            const promptEl = document.getElementById("tui-prompt");
            const inputEl = document.getElementById("tui-input");
            const sendBtn = document.getElementById("tui-send");
            const metaTitle = document.getElementById("tui-meta-title");
            const metaKv = document.getElementById("tui-meta-kv");

            const spinnerTimers = new Map();
            const meta = Object.create(null);

            let currentPrompt = null;

            function scrollToBottom() {
                root.scrollTop = root.scrollHeight;
            }

            function updateMeta() {
                metaTitle.textContent = document.title;
                const keys = Object.keys(meta);
                const pairs = keys.map(k => k + "=" + meta[k]);
                metaKv.textContent = pairs.join("   ");
            }

            function setPrompt(p) {
                currentPrompt = p;
                promptEl.textContent = p ? (p.prompt || "") : "";

                promptEl.className = "";
                if (p && Array.isArray(p.classes)) {
                    for (const c of p.classes) promptEl.classList.add(c);
                }

                if (!p) {
                    inputEl.disabled = true;
                    sendBtn.disabled = true;
                    inputEl.value = "";
                    return;
                }

                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.value = "";
                inputEl.focus();

                sendBtn.textContent = (p.mode === "enter") ? "Continue" : "Send";
            }

            async function postInput(value) {
                if (!currentPrompt) return;

                const payload = { promptId: currentPrompt.promptId, value };
                await fetch("/input", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }

            function onSend() {
                if (!currentPrompt) return;

                if (currentPrompt.mode === "enter") {
                    postInput("");
                    return;
                }

                postInput(inputEl.value);
            }

            sendBtn.addEventListener("click", onSend);
            inputEl.addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return;
                e.preventDefault();
                onSend();
            });

            function renderElement(el) {
                if (!el || !el.kind) return;

                switch (el.kind) {
                    case "line":
                    case "centred": {
                        const div = document.createElement("div");
                        div.id = el.id;
                        if (Array.isArray(el.classes)) for (const c of el.classes) div.classList.add(c);
                        div.textContent = el.text || "";
                        root.appendChild(div);
                        return;
                    }

                    case "box": {
                        const outer = document.createElement("div");
                        outer.id = el.id;
                        if (Array.isArray(el.boxClasses)) for (const c of el.boxClasses) outer.classList.add(c);

                        const border = document.createElement("div");
                        border.id = el.id + "-border";
                        if (Array.isArray(el.borderClasses)) for (const c of el.borderClasses) border.classList.add(c);

                        if (typeof el.title === "string" && el.title.trim()) {
                            const title = document.createElement("div");
                            title.id = el.id + "-title";
                            if (Array.isArray(el.titleClasses)) for (const c of el.titleClasses) title.classList.add(c);
                            title.textContent = el.title;
                            border.appendChild(title);
                        }

                        const body = document.createElement("pre");
                        body.id = el.id + "-body";
                        if (Array.isArray(el.bodyClasses)) for (const c of el.bodyClasses) body.classList.add(c);
                        body.textContent = el.body || "";
                        border.appendChild(body);

                        outer.appendChild(border);
                        root.appendChild(outer);
                        return;
                    }

                    default:
                        return;
                }
            }

            function startSpinner(sp) {
                const div = document.createElement("div");
                div.id = sp.id;
                if (Array.isArray(sp.classes)) for (const c of sp.classes) div.classList.add(c);
                root.appendChild(div);

                const frames = ["⋅..", ".⋅.", "..⋅", ".⋅."];
                let i = 0;

                div.textContent = (sp.label || "") + " " + frames[0];

                const intervalMs = typeof sp.intervalMs === "number" ? sp.intervalMs : 300;
                const timer = setInterval(() => {
                    i += 1;
                    div.textContent = (sp.label || "") + " " + frames[i % frames.length];
                }, intervalMs);

                spinnerTimers.set(sp.id, timer);
            }

            function stopSpinner(id) {
                const timer = spinnerTimers.get(id);
                if (timer) clearInterval(timer);
                spinnerTimers.delete(id);

                const el = document.getElementById(id);
                if (!el) return;
                if (!el.parentNode) return;
                el.parentNode.removeChild(el);
            }

            function applyInit(evt) {
                if (userCssEl) userCssEl.textContent = (evt.css || "");
                document.title = evt.title || document.title;
                updateMeta();

                root.innerHTML = "";

                if (Array.isArray(evt.elements)) {
                    for (const el of evt.elements) renderElement(el);
                }

                if (Array.isArray(evt.spinners)) {
                    for (const sp of evt.spinners) startSpinner(sp);
                }

                setPrompt(evt.prompt || null);
                scrollToBottom();
            }

            const es = new EventSource("/events");
            es.onmessage = (msg) => {
                let evt = null;
                try {
                    evt = JSON.parse(msg.data);
                } catch {
                    return;
                }

                if (!evt || !evt.t) return;

                switch (evt.t) {
                    case "init":
                        applyInit(evt);
                        return;

                    case "clear":
                        root.innerHTML = "";
                        scrollToBottom();
                        return;

                    case "append":
                        renderElement(evt.el);
                        scrollToBottom();
                        return;

                    case "thinking_start":
                        startSpinner(evt.spinner);
                        scrollToBottom();
                        return;

                    case "thinking_stop":
                        stopSpinner(evt.id);
                        scrollToBottom();
                        return;

                    case "prompt":
                        setPrompt(evt.prompt);
                        return;

                    case "prompt_clear":
                        setPrompt(null);
                        return;

                    case "meta":
                        meta[evt.key] = evt.value;
                        if (evt.key === "title") document.title = evt.value;
                        updateMeta();
                        return;

                    case "css":
                        if (userCssEl) userCssEl.textContent = (evt.css || "");
                        return;

                    default:
                        return;
                }
            };

            inputEl.disabled = true;
            sendBtn.disabled = true;
        })();
    </script>
</body>

</html>
